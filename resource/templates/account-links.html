<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="yybwechat — 已激活短链接">
  <title>已激活短链接 · yybwechat</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/css/console.css?v=20261030-ui3">
  <link rel="stylesheet" href="/static/css/platform.css?v=20261030-ui3">
  <style>
    /* 页面专属：链接表格的列宽与地址行。颜色一律走 console.css 的 token。 */
    /* 统计只有 4 张卡，而 console.css 的 .kpis 是给 5 张卡用的固定 5 列——
       不覆盖的话第 4 张会被挤到第二行、独占一整行。 */
    .page .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    @media (max-width: 1080px) { .page .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 720px) { .page .kpis { grid-template-columns: minmax(0, 1fr); } }

    .link-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
    .link-toolbar select { height: 28px; }
    .link-kind { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
    .link-acc { display: grid; gap: 2px; min-width: 0; }
    .link-acc strong { font-size: 12.5px; font-weight: 580; }
    .link-acc small { color: var(--faint); font-size: 11px; }
    .link-url {
      display: block; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11.5px; color: var(--muted);
    }
    .link-url.missing { color: var(--faint); font-style: normal; }
    .link-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .c-made, .c-exp { white-space: nowrap; font-size: 11.5px; color: var(--muted); }
    @media (max-width: 900px) {
      .link-url { max-width: 180px; }
      .c-made, .c-exp { display: none; }
    }
  </style>
</head>
<body>
  <!-- 顶栏按钮：由 platform.js 整体搬进外壳顶栏，id 与事件绑定不变 -->
  <div class="top-actions" id="pageActions">
    <button class="btn" id="reloadBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg>重新加载</button>
  </div>

  <main>
    <div class="page">
      <!-- 标题由外壳顶栏提供，这里只放一句话说明 -->
      <div class="page-head">
        <p>一次性账号授权链接：发出去让别人用手机重扫，不必交出管理员口令。链接只能被消费一次，消费或作废后即释放编号；有效期最长 7 天。<strong>链接等同于该账号的一次性授权</strong>，只发给可信任的人。要新建链接，请到「我的控制台」里对某个账号点「更新链接」。</p>
      </div>

      <!-- 统计：四个数字说清「现在有多少条、分别是什么状态」 -->
      <section class="kpis" aria-label="链接统计">
        <div class="kpi"><small>全部链接</small><strong class="num" id="countAll">—</strong><span class="sub">含历史记录</span></div>
        <div class="kpi ok"><small>使用中</small><strong class="num" id="countActive">—</strong><span class="sub">可用且未消费</span></div>
        <div class="kpi warn"><small>已消费</small><strong class="num" id="countUsed">—</strong><span class="sub">已被使用一次</span></div>
        <div class="kpi bad"><small>已失效</small><strong class="num" id="countInactive">—</strong><span class="sub">过期或已作废</span></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>链接列表</h2>
          <div class="right link-toolbar">
            <label class="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
              <input id="searchInput" type="search" placeholder="搜索账号 / 地址" autocomplete="off" spellcheck="false">
            </label>
            <select id="statusFilter" class="input" aria-label="按状态筛选">
              <option value="all">全部状态</option>
              <option value="active">使用中</option>
              <option value="used">已消费</option>
              <option value="expired">已过期</option>
              <option value="revoked">已作废</option>
            </select>
            <select id="kindFilter" class="input" aria-label="按类型筛选">
              <option value="all">全部类型</option>
              <option value="update">更新链接</option>
              <option value="add">新增链接</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>类型</th><th>账号</th><th>渠道</th><th>状态</th>
                <th class="c-made">创建时间</th><th class="c-exp">失效时间</th><th aria-label="操作"></th>
              </tr>
            </thead>
            <tbody id="linkRows"></tbody>
          </table>
          <div class="empty-state" id="linkEmpty">链接加载中…</div>
        </div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const esc = value => String(value == null ? "" : value).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      const state = { links: [], counts: { active: 0, used: 0, expired: 0, revoked: 0 }, selected: null };

      const KIND_LABEL = { update: "更新链接", add: "新增链接" };
      const PRODUCT_LABEL = { appstore: "应用宝", pcmgr: "电脑管家" };
      const STATUS_LABEL = { active: "使用中", used: "已消费", expired: "已过期", revoked: "已作废" };
      // 状态 → 徽标配色。已消费是「完成」而不是错误，用中性色；过期/作废才是需要收尾的。
      const STATUS_CLASS = { active: "ok", used: "", expired: "warn", revoked: "bad" };

      function fmtTime(seconds) {
        if (!seconds) return "—";
        const d = new Date(seconds * 1000);
        const p = n => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      }

      function accountLabel(item) {
        const acc = item.account || {};
        return acc.remark || acc.nickname || acc.alias || `账号 ${item.account_id}`;
      }

      async function api(method, url, body) {
        const options = { method, headers: { "Content-Type": "application/json" } };
        if (body !== undefined) options.body = JSON.stringify(body);
        const response = await fetch(url, options);
        const text = await response.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch { data = text; }
        if (response.status === 401) { location.replace("/login"); throw new Error("登录已失效"); }
        const isEnvelope = data && typeof data === "object" && Object.prototype.hasOwnProperty.call(data, "code");
        if (!response.ok || (isEnvelope && data.code !== 0)) {
          throw new Error(isEnvelope ? data.msg : ("HTTP " + response.status));
        }
        return isEnvelope ? data.data : data;
      }

      function visible() {
        const status = $("statusFilter").value;
        const kind = $("kindFilter").value;
        const q = $("searchInput").value.trim().toLowerCase();
        return state.links.filter(item => {
          if (status !== "all" && item.status !== status) return false;
          if (kind !== "all" && item.kind !== kind) return false;
          if (!q) return true;
          return (accountLabel(item) + " " + (item.url || "")).toLowerCase().includes(q);
        });
      }

      function renderStats() {
        const c = state.counts || {};
        $("countAll").textContent = String(state.links.length);
        $("countActive").textContent = String(c.active || 0);
        $("countUsed").textContent = String(c.used || 0);
        // 「已失效」把过期与作废合在一起：对使用者是同一个结论——这条链接没用了。
        $("countInactive").textContent = String((c.expired || 0) + (c.revoked || 0));
      }

      function renderRows() {
        const items = visible();
        const empty = $("linkEmpty");
        if (!items.length) {
          $("linkRows").innerHTML = "";
          empty.hidden = false;
          empty.innerHTML = state.links.length
            ? `<div class="empty-state-inner">没有符合筛选条件的链接</div>`
            : `<div class="empty-state-inner"><span class="empty-state-icon">🔗</span>还没有生成过链接<br><span>在控制台里对某个账号点「更新链接」即可</span></div>`;
          return;
        }
        empty.hidden = true;
        $("linkRows").innerHTML = items.map(item => {
          const url = item.url || "";
          const statusClass = STATUS_CLASS[item.status] || "";
          const actions = [
            url ? `<button class="btn sm" data-act="copy" data-id="${item.id}">复制</button>` : "",
            url ? `<a class="btn sm" href="${esc(url)}" target="_blank" rel="noopener">打开</a>` : "",
            item.status === "active" ? `<button class="btn sm" data-act="revoke" data-id="${item.id}">作废</button>` : "",
            `<button class="btn sm danger" data-act="delete" data-id="${item.id}">删除</button>`,
          ].filter(Boolean).join("");
          return `
            <tr data-id="${item.id}">
              <td><span class="link-kind">${KIND_LABEL[item.kind] || esc(item.kind)}</span></td>
              <td>
                <div class="link-acc">
                  <strong>${esc(accountLabel(item))}</strong>
                  <small>#${item.account_id}${item.used_at ? ` · 消费于 ${fmtTime(item.used_at)}` : ""}</small>
                  <span class="link-url ${url ? "" : "missing"}" title="${esc(url)}">${url ? esc(url) : "历史链接未保存，无法恢复地址"}</span>
                </div>
              </td>
              <td><span class="badge">${PRODUCT_LABEL[item.product] || esc(item.product || "—")}</span></td>
              <td><span class="pill ${statusClass}"><i></i>${STATUS_LABEL[item.status] || esc(item.status)}</span></td>
              <td class="c-made">${fmtTime(item.created_at)}</td>
              <td class="c-exp">${fmtTime(item.expires_at)}</td>
              <td><div class="link-actions">${actions}</div></td>
            </tr>`;
        }).join("");
      }

      function render() {
        renderStats();
        renderRows();
      }

      // 确认弹窗：作废与删除都属于不可撤销操作，统一走这里。
      function confirmAction(title, text, onConfirm) {
        const overlay = document.createElement("div");
        overlay.className = "modal-overlay";
        overlay.innerHTML = `
          <div class="modal" role="dialog" aria-modal="true">
            <h3>${esc(title)}</h3>
            <p>${esc(text)}</p>
            <div class="modal-actions">
              <button class="btn" data-act="cancel" type="button">取消</button>
              <button class="btn danger" data-act="ok" type="button">确认</button>
            </div>
          </div>`;
        document.body.appendChild(overlay);
        const close = () => overlay.remove();
        overlay.addEventListener("click", event => { if (event.target === overlay) close(); });
        overlay.querySelector('[data-act="cancel"]').addEventListener("click", close);
        overlay.querySelector('[data-act="ok"]').addEventListener("click", async () => {
          close();
          try { await onConfirm(); } catch (e) { toast(e.message, "error"); }
        });
      }

      function toast(message, kind) {
        const node = document.createElement("div");
        node.className = "notice " + (kind === "error" ? "error" : "ok");
        node.textContent = message;
        node.style.cssText = "position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;max-width:80vw";
        document.body.appendChild(node);
        setTimeout(() => node.remove(), 3200);
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          toast("链接已复制");
        } catch {
          // 非 HTTPS 或未授权剪贴板时退回选中：至少让用户能 Ctrl+C。
          const input = document.createElement("textarea");
          input.value = text;
          document.body.appendChild(input);
          input.select();
          try { document.execCommand("copy"); toast("链接已复制"); }
          catch { toast("复制失败，请手动选中地址", "error"); }
          input.remove();
        }
      }

      async function load() {
        const data = await api("GET", "/api/account-links");
        state.links = (data && data.links) || [];
        state.counts = (data && data.counts) || {};
        render();
      }

      $("linkRows").addEventListener("click", event => {
        const button = event.target.closest("button[data-act]");
        if (!button) return;
        const id = button.dataset.id;
        const item = state.links.find(link => String(link.id) === String(id));
        if (!item) return;
        const act = button.dataset.act;
        if (act === "copy") { copyText(item.url); return; }
        if (act === "revoke") {
          confirmAction("作废这条链接？", "作废后立即失效，且不能恢复。对方手里的地址会打不开。", async () => {
            await api("POST", `/api/account-links/${id}/revoke`);
            await load();
            toast("已作废");
          });
          return;
        }
        if (act === "delete") {
          confirmAction("删除这条记录？", "只删除本地记录（用于清理历史），已发出的地址同样会失效。", async () => {
            await api("DELETE", `/api/account-links/${id}`);
            await load();
            toast("已删除");
          });
        }
      });

      $("reloadBtn").addEventListener("click", () => {
        load().then(() => toast("已刷新")).catch(error => toast(error.message, "error"));
      });
      for (const id of ["statusFilter", "kindFilter"]) $(id).addEventListener("change", render);
      $("searchInput").addEventListener("input", render);

      load().catch(error => {
        $("linkEmpty").hidden = false;
        $("linkEmpty").innerHTML = `<div class="empty-state-inner"><span class="empty-state-icon">⚠</span>加载失败：${esc(error.message)}</div>`;
      });
    })();
  </script>
  <script src="/static/js/platform.js?v=20261030-ui4"></script>
</body>
</html>
