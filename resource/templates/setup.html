<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/css/console.css">
  <title>初始化管理员 · yybwechat</title>
  <style>
    /* 页面专属：居中卡片与表单节奏，通用样式见 console.css */
    body { min-height: 100vh; display: grid; place-items: center; padding: 20px; line-height: 1.6; }

    .card {
      width: min(400px, 100%);
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow-md);
    }
    .brand { gap: 10px; margin-bottom: 18px; }

    h1 { margin: 0 0 6px; font-size: 20px; font-weight: 760; letter-spacing: -0.01em; }
    .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
    .form-grid { display: grid; gap: 14px; margin-bottom: 16px; }
    .msg { min-height: 20px; margin: 0 0 10px; font-size: 13px; color: var(--danger); }
    .msg.ok { color: var(--success); }
    .tip {
      margin-top: 16px; padding: 10px 12px; border: 1px solid var(--line);
      border-radius: var(--radius); font-size: 12px; color: var(--muted); line-height: 1.6;
    }
    .tip code {
      background: var(--surface-strong); padding: 1px 5px; border-radius: 4px; font-size: 11px;
    }
    .theme-btn { position: fixed; top: 16px; right: 16px; }
  </style>
</head>
<body>
  <button class="theme-btn" id="themeToggle" title="切换主题" aria-label="切换深色/浅色模式">🌓</button>
  <div class="card">
    <div class="brand">
      <div class="mark" aria-hidden="true">Y</div>
      <div>
        <div class="brand-title">yybwechat</div>
        <div class="brand-sub">微信扫码登录服务</div>
      </div>
    </div>
    <h1>创建管理员</h1>
    <p class="sub">这是首次启动，请设置管理员账号。系统只保留这一个账号，创建后本页不再显示。</p>
    <form id="setupForm" autocomplete="on">
      <div class="form-grid">
        <div class="field">
          <label for="username">用户名</label>
          <input class="input" id="username" name="username" autocomplete="username" required spellcheck="false">
        </div>
        <div class="field">
          <label for="password">密码（至少 8 位）</label>
          <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label for="confirm">确认密码</label>
          <input class="input" id="confirm" type="password" autocomplete="new-password" minlength="8" required>
        </div>
      </div>
      <p class="msg" id="msg" role="alert"></p>
      <button class="btn primary btn-block" id="submitBtn" type="submit">创建并登录</button>
    </form>
    <div class="tip">
      也可以在运行前通过 <code>YYB_ADMIN_USER</code> 与 <code>YYB_ADMIN_PASSWORD</code>
      环境变量预设，适合容器化无人值守部署。
    </div>
  </div>
  <script>
    (function () {
      var saved = localStorage.getItem("yybwechat-theme");
      if (saved === "dark" || (!saved && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
    document.getElementById("themeToggle").addEventListener("click", function () {
      var dark = document.documentElement.getAttribute("data-theme") === "dark";
      if (dark) { document.documentElement.removeAttribute("data-theme"); localStorage.setItem("yybwechat-theme", "light"); }
      else { document.documentElement.setAttribute("data-theme", "dark"); localStorage.setItem("yybwechat-theme", "dark"); }
    });

    // 已初始化过管理员时不再显示本页
    fetch("/api/auth/status").then(function (r) { return r.json(); }).then(function (j) {
      if ((j.data || {}).initialized) location.replace("/login");
    }).catch(function () {});

    document.getElementById("setupForm").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var msg = document.getElementById("msg"), btn = document.getElementById("submitBtn");
      var pwd = document.getElementById("password").value;
      var confirm = document.getElementById("confirm").value;
      msg.className = "msg";
      if (pwd !== confirm) { msg.textContent = "两次输入的密码不一致"; return; }
      if (pwd.length < 8) { msg.textContent = "密码至少需要 8 位"; return; }
      msg.textContent = ""; btn.disabled = true; btn.textContent = "创建中…";
      fetch("/api/auth/setup", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: document.getElementById("username").value, password: pwd })
      }).then(function (r) {
        return r.text().then(function (t) {
          var j = {}; try { j = JSON.parse(t); } catch (e) { j = {}; }
          if (r.ok && j.code === 0) {
            msg.className = "msg ok"; msg.textContent = "创建成功，正在进入控制台…";
            setTimeout(function () { location.replace("/"); }, 600);
            return;
          }
          msg.textContent = j.msg || ("创建失败 HTTP " + r.status);
          btn.disabled = false; btn.textContent = "创建并登录";
        });
      }).catch(function (e) {
        msg.textContent = "网络错误: " + e.message;
        btn.disabled = false; btn.textContent = "创建并登录";
      });
    });
  </script>
</body>
</html>
