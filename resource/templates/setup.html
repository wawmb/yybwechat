<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/css/console.css?v=20261030-ui3">
  <title>初始化管理员 · yybwechat</title>
  <style>
    /* 页面专属：居中卡片与表单节奏。通用 token / 组件见 console.css，
       颜色、圆角、阴影这里一律不写死。 */

    .auth-page { min-height: 100vh; display: grid; place-items: center; padding: 28px 18px 40px; }

    .auth-card {
      width: min(400px, 100%);
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-md);
      animation: cardIn 200ms ease-out;
    }
    .auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .auth-mark {
      display: grid; place-items: center; flex: none;
      width: 34px; height: 34px; border-radius: 10px;
      background: var(--grad-brand); color: #fff;
      font-size: 15px; font-weight: 700;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.35), 0 2px 6px -1px oklch(0.45 0.16 275 / 0.45);
    }
    .auth-brand strong { display: block; font-size: 13.5px; font-weight: 650; letter-spacing: -0.01em; }
    .auth-brand span { display: block; font-size: 11px; color: var(--faint); }

    h1 { margin: 0 0 5px; font-size: 18px; font-weight: 650; letter-spacing: -0.015em; }
    .sub { margin: 0 0 18px; color: var(--faint); font-size: 12px; }
    .form-grid { display: grid; gap: 13px; margin-bottom: 14px; }
    .msg { min-height: 18px; margin: 0 0 10px; font-size: 12px; color: var(--danger); }
    .msg.ok { color: var(--success); }
    .theme-btn { position: fixed; top: 14px; right: 14px; background: var(--surface); border: 1px solid var(--line); }
  </style>
</head>
<body>
  <button class="icon-btn theme-btn" id="themeToggle" title="切换主题" aria-label="切换深色/浅色模式"></button>
  <main class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-mark" aria-hidden="true">Y</span>
      <span><strong>yybwechat</strong><span>微信扫码登录服务</span></span>
    </div>
    <h1>创建管理员</h1>
    <p class="sub">这是首次启动，请设置管理员账号。系统只保留这一个账号，创建后本页不再显示。</p>
    <form id="setupForm" autocomplete="on">
      <div class="form-grid">
        <div class="field">
          <label for="username">用户名</label>
          <input class="input" id="username" name="username" autocomplete="username" required spellcheck="false">
        </div>
        <div class="field">
          <label for="password">密码（至少 8 位）</label>
          <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label for="confirm">确认密码</label>
          <input class="input" id="confirm" type="password" autocomplete="new-password" minlength="8" required>
        </div>
      </div>
      <p class="msg" id="msg" role="alert"></p>
      <button class="btn primary btn-block" id="submitBtn" type="submit">创建并登录</button>
    </form>
    <div class="notice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8.5v.01M12 11.5v4.5"/></svg>
      <span>也可以在运行前通过 <code>YYB_ADMIN_USER</code> 与 <code>YYB_ADMIN_PASSWORD</code> 环境变量预设，适合容器化无人值守部署。</span>
    </div>
  </div>
  </main>
  <script>
    (function () {
      var saved = localStorage.getItem("yybwechat-theme");
      if (saved === "dark" || (!saved && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
    var THEME_ICON = {
      dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>',
      light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>'
    };
    var themeToggle = document.getElementById("themeToggle");
    var syncTheme = function () {
      var dark = document.documentElement.getAttribute("data-theme") === "dark";
      themeToggle.innerHTML = THEME_ICON[dark ? "dark" : "light"];
      themeToggle.title = dark ? "切换到浅色模式" : "切换到深色模式";
    };
    syncTheme();
    themeToggle.addEventListener("click", function () {
      var dark = document.documentElement.getAttribute("data-theme") === "dark";
      if (dark) { document.documentElement.removeAttribute("data-theme"); localStorage.setItem("yybwechat-theme", "light"); }
      else { document.documentElement.setAttribute("data-theme", "dark"); localStorage.setItem("yybwechat-theme", "dark"); }
      syncTheme();
    });

    // 已初始化过管理员时不再显示本页
    fetch("/api/auth/status").then(function (r) { return r.json(); }).then(function (j) {
      if ((j.data || {}).initialized) location.replace("/login");
    }).catch(function () {});

    document.getElementById("setupForm").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var msg = document.getElementById("msg"), btn = document.getElementById("submitBtn");
      var pwd = document.getElementById("password").value;
      var confirm = document.getElementById("confirm").value;
      msg.className = "msg";
      if (pwd !== confirm) { msg.textContent = "两次输入的密码不一致"; return; }
      if (pwd.length < 8) { msg.textContent = "密码至少需要 8 位"; return; }
      msg.textContent = ""; btn.disabled = true; btn.textContent = "创建中…";
      fetch("/api/auth/setup", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: document.getElementById("username").value, password: pwd })
      }).then(function (r) {
        return r.text().then(function (t) {
          var j = {}; try { j = JSON.parse(t); } catch (e) { j = {}; }
          if (r.ok && j.code === 0) {
            msg.className = "msg ok"; msg.textContent = "创建成功，正在进入控制台…";
            setTimeout(function () { location.replace("/"); }, 600);
            return;
          }
          msg.textContent = j.msg || ("创建失败 HTTP " + r.status);
          btn.disabled = false; btn.textContent = "创建并登录";
        });
      }).catch(function (e) {
        msg.textContent = "网络错误: " + e.message;
        btn.disabled = false; btn.textContent = "创建并登录";
      });
    });
  </script>
</body>
</html>
