<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="yybwechat — 扫码添加微信账号">
  <title>扫码添加账号 · yybwechat</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/css/console.css?v=20261030-ui3">
  <link rel="stylesheet" href="/static/css/platform.css?v=20261030-ui3">
  <style>
    /* 页面专属：扫码卡片与状态展示。通用 token / 组件见 console.css，
       颜色、圆角、阴影这里一律不写死。 */

    /* 居中交给 .scan-page：在 body 上做居中会把左侧栏外壳一起压窄。 */
    .scan-page {
      min-height: calc(100vh - var(--topbar-h));
      display: grid; place-items: center; padding: 28px 20px 40px;
    }

    .scan-card {
      width: min(440px, 100%); background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md); overflow: hidden;
      animation: cardIn 200ms ease-out;
    }

    .card-header {
      padding: 22px 24px 0; text-align: center;
    }

    .card-header h2 {
      font-size: 17px; font-weight: 650; letter-spacing: -0.015em;
    }

    .card-header p {
      margin-top: 5px; color: var(--faint); font-size: 12px;
    }

    .card-body {
      padding: 20px 24px 24px; display: grid; gap: 16px;
    }

    /* ---- QR area ---- */
    .qr-wrapper {
      width: 220px; height: 220px; margin: 0 auto;
      border: 1px solid var(--line); border-radius: var(--radius);
      display: grid; place-items: center; overflow: hidden;
      background: var(--surface); position: relative;
    }
    .qr-wrapper img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .qr-wrapper .qr-placeholder {
      color: var(--faint); font-size: 13px; text-align: center; padding: 20px; line-height: 1.5;
    }
    .qr-wrapper .qr-spinner {
      width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    .qr-overlay {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: var(--surface); opacity: 0; pointer-events: none; transition: opacity 300ms ease;
    }
    .qr-overlay.active { opacity: 1; }
    .qr-overlay svg { width: 44px; height: 44px; color: var(--success); }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- status ---- */
    .status-bar {
      text-align: center; min-height: 52px; display: grid; place-items: center; gap: 6px;
    }
    .status-text { font-size: 14px; font-weight: 680; transition: color 300ms ease; }
    .status-text.pending { color: var(--muted); }
    .status-text.scanned { color: var(--accent); }
    .status-text.authorized, .status-text.success { color: var(--success); }
    .status-text.error { color: var(--danger); }

    .status-anim { display: flex; align-items: center; justify-content: center; gap: 4px; }
    .status-anim .dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .status-anim .dot:nth-child(2) { animation-delay: 0.2s; }
    .status-anim .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%,80%,100% { opacity: 0.3; transform: scale(0.75); } 40% { opacity: 1; transform: scale(1); } }

    .countdown {
      text-align: center; font-size: 12px; color: var(--faint);
      min-height: 16px; font-variant-numeric: tabular-nums;
    }
    .countdown.expiring { color: var(--danger); font-weight: 680; }

    /* ---- success info ---- */
    .result-box {
      background: var(--success-soft); border: 1px solid var(--success);
      border-radius: var(--radius); padding: 14px;       display: none; text-align: left;
      font-size: 13px; grid-template-columns: 1fr; gap: 8px;
    }
    .result-box.show { display: grid; }
    .result-box .result-head { display: flex; align-items: center; gap: 8px; }
    .result-box .result-icon { display: grid; place-items: center; color: var(--success); }
    .result-box .result-icon svg { width: 16px; height: 16px; }
    .result-box .result-title { font-weight: 620; color: var(--success); }
    .result-box .result-meta { color: var(--muted); font-size: 12px; word-break: break-all; }
    .result-box .result-meta div { display: flex; gap: 10px; justify-content: space-between; padding: 1px 0; }

    /* ---- buttons ---- */
    .btn-row {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    }
    .btn-row .btn { flex: 1; }

    /* ---- proxy panel ---- */
    .proxy-panel {
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); padding: 0 12px; margin-bottom: 14px;
    }
    .proxy-panel > summary {
      cursor: pointer; padding: 10px 0; font-size: 13px; font-weight: 680;
      display: flex; align-items: center; gap: 8px; list-style: none;
    }
    .proxy-panel > summary::-webkit-details-marker { display: none; }
    .proxy-panel > summary::before {
      content: "▸"; color: var(--muted); font-size: 11px; transition: transform 160ms ease;
    }
    .proxy-panel[open] > summary::before { transform: rotate(90deg); }
    .proxy-panel .proxy-current {
      margin-left: auto; font-weight: 600; font-size: 12px; color: var(--muted);
    }
    .proxy-body { padding: 2px 0 12px; display: grid; gap: 10px; }
    .proxy-grid-3 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .proxy-hint { font-size: 11px; color: var(--faint); line-height: 1.55; }
    .proxy-actions { display: flex; gap: 8px; }
    .proxy-actions .btn { flex: 1; }

    @media (prefers-reduced-motion: reduce) {
      .qr-wrapper .qr-spinner, .status-anim .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main class="scan-page">
  <div class="scan-card">
    <div class="card-header">
      <h2>扫码添加账号</h2>
      <p>使用手机微信「扫一扫」扫描下方二维码并确认登录</p>
    </div>

    <div class="card-body">
      <!-- 登录网络代理：决定新账号在微信侧被识别成从哪里登录 -->
      <details class="proxy-panel" id="proxyPanel">
        <summary>登录网络代理<span class="proxy-current" id="proxyCurrent">直连</span></summary>
        <div class="proxy-body">
          <div class="field">
            <label for="scanChannel">扫码渠道</label>
            <select class="select" id="scanChannel">
              <option value="appstore">应用宝（默认）</option>
              <option value="pcmgr">腾讯电脑管家</option>
            </select>
            <span class="field-hint" id="channelHint">换渠道会生成另一套身份的二维码，已有账号重扫时请保持原渠道。</span>
          </div>

          <div class="field">
            <label for="scanProxyMode">出口</label>
            <select class="select" id="scanProxyMode">
              <option value="direct">直连（使用服务器 IP）</option>
              <option value="profile">供应商配置（品赞 / 巨量）</option>
              <option value="static">静态代理</option>
              <option value="api">自定义提取 API</option>
            </select>
          </div>

          <div class="field hidden" id="proxyProfileRow">
            <label for="scanProxyProfile">供应商配置</label>
            <select class="select" id="scanProxyProfile"></select>
            <div class="proxy-grid-3">
              <select class="select" id="scanProvince"><option value="">省份（不限）</option></select>
              <select class="select" id="scanCity"><option value="">城市（不限）</option></select>
            </div>
          </div>

          <div class="field hidden" id="proxyStaticRow">
            <label for="scanStaticProxy">代理地址</label>
            <input class="input" id="scanStaticProxy" placeholder="host:port 或 socks5://user:pass@host:port" autocomplete="off" spellcheck="false">
          </div>

          <div class="field hidden" id="proxyApiRow">
            <label for="scanProxyAPI">提取 API</label>
            <input class="input" id="scanProxyAPI" placeholder="https://..." autocomplete="off" spellcheck="false">
          </div>

          <div class="proxy-actions">
            <button class="btn secondary" id="applyProxyBtn" type="button">应用并重新生成</button>
          </div>
          <div class="proxy-hint" id="proxyHint">
            新账号将使用该出口登录，并在入库时记住这份配置；已有账号重新扫码时沿用原代理，不受此处影响。
          </div>
        </div>
      </details>

      <!-- QR -->
      <div class="qr-wrapper" id="qrWrap">
        <div class="qr-placeholder">
          <div class="qr-spinner" style="margin:0 auto 10px"></div>
          生成中…
        </div>
        <div class="qr-overlay" id="qrOverlay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5 10-10"/></svg></div>
      </div>

      <!-- Status -->
      <div class="status-bar">
        <div class="status-text pending" id="statusText">正在获取二维码…</div>
        <div class="status-anim hidden" id="statusAnim">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>

      <!-- Countdown -->
      <div class="countdown" id="countdown"></div>

      <!-- Success result -->
      <div class="result-box" id="resultBox">
        <div class="result-head">
          <span class="result-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.6 2.6L16 9.5"/></svg></span>
          <span class="result-title">添加成功</span>
        </div>
        <div class="result-meta" id="resultMeta"></div>
      </div>

      <!-- Actions -->
      <div class="btn-row">
        <button class="btn primary" id="refreshBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg>重新生成</button>
        <a class="btn" href="/">返回控制台</a>
      </div>
    </div>
  </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const QR_TTL = 180; // 倒计时展示用，服务端实际会话有效期见 QRSessionTTL (5min)
    let sid = null, pollTimer = null, cdTimer = null, secsLeft = 0, confirming = false, settleTimer = null;
    // 代际号：每次「重新生成」自增。await 期间的旧 poll 回来时用它判断自己是否已过期，
    // 否则旧会话的结论（尤其是 cancelled）会把新一张二维码的状态覆盖掉。
    let generation = 0;

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    // ---- theme ----
    // 主题由外壳脚本 platform.js 统一初始化，页面不再各写一份。

    // ---- API ----
    async function api(method, url, body) {
      const init = { method };
      if (body !== undefined) {
        init.headers = { "Content-Type": "application/json" };
        init.body = JSON.stringify(body);
      }
      const r = await fetch(url, init);
      const t = await r.text();
      let d; try { d = t ? JSON.parse(t) : null; } catch { d = t; }
      const isEnv = d && typeof d === "object" && !Array.isArray(d)
        && Object.prototype.hasOwnProperty.call(d, "code")
        && Object.prototype.hasOwnProperty.call(d, "msg")
        && Object.prototype.hasOwnProperty.call(d, "data");
      if (!r.ok || (isEnv && d.code !== 0)) {
        throw { status: r.status, message: isEnv ? d.msg : ("HTTP " + r.status), data: isEnv ? d.data : d };
      }
      return isEnv ? d.data : d;
    }

    // ---- 登录网络代理 ----
    // 扫码这一刻选定的出口会决定新账号在微信侧被识别成从哪里登录。
    // 直连时不额外写账号代理设置（默认就是直连），其它模式会随入库一起保存。
    const proxyState = { profiles: [], provinces: [], loading: false };

    function currentProxyMode() { return $("scanProxyMode").value; }

    function toggleProxyFields() {
      const mode = currentProxyMode();
      $("proxyProfileRow").classList.toggle("hidden", mode !== "profile");
      $("proxyStaticRow").classList.toggle("hidden", mode !== "static");
      $("proxyApiRow").classList.toggle("hidden", mode !== "api");
      $("proxyCurrent").textContent = proxyLabel();
    }

    function proxyLabel() {
      const mode = currentProxyMode();
      if (mode === "static") return "静态代理";
      if (mode === "api") return "自定义 API";
      if (mode === "profile") {
        const profile = $("scanProxyProfile");
        const name = profile.options[profile.selectedIndex]?.text || "供应商配置";
        const province = $("scanProvince");
        const city = $("scanCity");
        const region = city.value ? city.options[city.selectedIndex]?.text
          : (province.value ? province.options[province.selectedIndex]?.text : "");
        return region ? `${name} · ${region}` : name;
      }
      return "直连";
    }

    async function loadProxyOptions() {
      if (proxyState.loading || proxyState.profiles.length) return;
      proxyState.loading = true;
      try {
        proxyState.profiles = await api("GET", "/api/proxy-profiles");
        $("scanProxyProfile").innerHTML = proxyState.profiles.length
          ? proxyState.profiles.map(p => `<option value="${p.id}">${escapeHTML(p.name)}</option>`).join("")
          : '<option value="">请先在代理设置中添加配置</option>';
        proxyState.provinces = await api("GET", "/api/proxy-profiles/areas/provinces");
        $("scanProvince").innerHTML = '<option value="">省份（不限）</option>' +
          proxyState.provinces.map(a => `<option value="${escapeHTML(a.code)}">${escapeHTML(a.name)}</option>`).join("");
      } catch (e) {
        $("proxyHint").textContent = "供应商配置读取失败：" + (e.message || "未知错误");
      } finally {
        proxyState.loading = false;
      }
    }

    async function loadProxyCities() {
      const province = $("scanProvince").value;
      $("scanCity").innerHTML = '<option value="">城市（不限）</option>';
      if (!province) return;
      try {
        const cities = await api("GET", `/api/proxy-profiles/areas/cities?province=${encodeURIComponent(province)}`);
        $("scanCity").innerHTML = '<option value="">城市（不限）</option>' +
          cities.map(a => `<option value="${escapeHTML(a.code)}">${escapeHTML(a.name)}</option>`).join("");
      } catch (e) {
        $("proxyHint").textContent = "城市列表读取失败：" + (e.message || "未知错误");
      }
    }

    // 组装 POST /qr 的请求体。直连返回 null，表示沿用「不写代理设置」的默认路径。
    function proxyPayload() {
      const mode = currentProxyMode();
      if (mode === "direct") return null;
      const province = $("scanProvince");
      const city = $("scanCity");
      const payload = { product: "appstore", proxy_type: "http" };
      if (mode === "static") {
        payload.mode = "static";
        payload.static_proxy = $("scanStaticProxy").value.trim();
        if (!payload.static_proxy) throw new Error("请填写静态代理地址");
        return payload;
      }
      if (mode === "api") {
        payload.mode = "api";
        payload.api_url = $("scanProxyAPI").value.trim();
        if (!payload.api_url) throw new Error("请填写提取 API 地址");
        return payload;
      }
      const profileID = $("scanProxyProfile").value;
      if (!profileID) throw new Error("请先添加代理供应商配置");
      payload.mode = "api";
      payload.provider_profile_id = Number(profileID);
      // 品赞按区县编码定位，巨量按省市名定位，两者都带上更稳妥
      payload.region_code = city.value || province.value || "";
      payload.region_province = province.value
        ? province.options[province.selectedIndex]?.text || "" : "";
      payload.region_city = city.value ? city.options[city.selectedIndex]?.text || "" : "";
      return payload;
    }

    function setStatus(text, cls, showAnim) {
      const st = $("statusText");
      st.textContent = text;
      st.className = "status-text " + (cls || "pending");

      const anim = $("statusAnim");
      if (showAnim) {
        anim.classList.remove("hidden");
        anim.querySelectorAll(".dot").forEach(d => d.style.background =
          cls === "scanned" ? "var(--accent)" : "var(--muted)");
      } else {
        anim.classList.add("hidden");
      }
    }

    function stopTimers() {
      if (pollTimer) clearInterval(pollTimer);
      if (cdTimer) clearInterval(cdTimer);
      if (settleTimer) clearTimeout(settleTimer);
      pollTimer = cdTimer = settleTimer = null;
    }

    function startCountdown() {
      secsLeft = QR_TTL;
      $("countdown").textContent = `有效期 ${secsLeft}s`;
      $("countdown").classList.remove("expiring");
      cdTimer = setInterval(() => {
        secsLeft--;
        if (secsLeft <= 15) $("countdown").classList.add("expiring");
        $("countdown").textContent = secsLeft > 0 ? `有效期 ${secsLeft}s` : "已过期，刷新中…";
        if (secsLeft <= 0) { stopTimers(); newQR(); }
      }, 1000);
    }

    const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5 10-10"/></svg>';

    function showQR(qrUrl) {
      $("qrWrap").innerHTML =
        `<img src="${qrUrl}?t=${Date.now()}" alt="二维码">` +
        `<div class="qr-overlay" id="qrOverlay">${CHECK_SVG}</div>`;
    }

    function showSuccess(account) {
      const overlay = $("qrOverlay");
      if (overlay) overlay.classList.add("active");
      setStatus("添加成功", "success", false);
      $("countdown").textContent = "";

      const name = escapeHTML(account.nickname || account.alias || account.openid);
      const channel = (account.provider === "pcmgr") ? "腾讯电脑管家" : "应用宝";
      $("resultMeta").innerHTML = `
        <div>昵称：${name}</div>
        <div>渠道：${escapeHTML(channel)}</div>
        <div>openid：${escapeHTML(account.openid)}</div>
        <div>状态：${escapeHTML(account.status === "alive" ? "可用" : account.status === "expired" ? "需重扫" : account.status)}</div>`;
      $("resultBox").classList.add("show");
    }

    function resetUI() {
      const overlay = $("qrOverlay");
      if (overlay) overlay.classList.remove("active");
      $("resultBox").classList.remove("show");
      $("qrWrap").innerHTML = `<div class="qr-placeholder"><div class="qr-spinner" style="margin:0 auto 10px"></div>生成中…</div>`;
      $("countdown").textContent = "";
      $("countdown").classList.remove("expiring");
    }

    async function newQR() {
      if (confirming) return;
      const gen = ++generation;
      stopTimers();

      // 旧会话必须先退役：它没碰过账号库，但留着的会话会让一个迟到的
      // poll / confirm 把上一张二维码的扫码结果补完，用户看到的是
      // 「我明明刷新了，怎么还注册了刚才那个号」。
      const previous = sid;
      sid = null;
      if (previous) {
        try { await api("POST", `/qr/${previous}/cancel`); } catch {}
        if (gen !== generation) return;
      }

      resetUI();
      setStatus("正在获取二维码…", "pending", false);

      let payload = null;
      try {
        payload = proxyPayload();
      } catch (e) {
        setStatus(e.message, "error", false);
        return;
      }
      // 渠道与应用宝不同时必须显式带上：两个渠道的 appid 不同，
      // 漏传就会生成一张「扫了也换不出凭据」的二维码。
      const channel = $("scanChannel").value;
      if (channel && channel !== "appstore") {
        payload = payload || {};
        payload.product = channel;
      }

      try {
        const r = payload ? await api("POST", "/qr", payload) : await api("POST", "/qr");
        if (gen !== generation) {
          // 请求飞行期间用户又点了一次「重新生成」：这张码已经没人看了，直接退役。
          api("POST", `/qr/${r.session_id}/cancel`).catch(() => {});
          return;
        }
        sid = r.session_id;
        showQR(r.image_url);
        setStatus("等待扫码", "pending", true);
        startCountdown();
        pollTimer = setInterval(poll, 1500);
      } catch (e) {
        if (gen !== generation) return;
        setStatus("获取失败：" + (e.message || "未知错误"), "error", false);
      }
    }

    async function poll() {
      if (!sid || confirming) return;
      const gen = generation, current = sid;
      let st;
      try { st = await api("GET", `/qr/${current}/poll`); } catch { return; }
      // 这次轮询在飞的时候用户可能已经点了「重新生成」，旧的结论（cancelled / expired）
      // 不能再往界面上写，否则新二维码刚显示出来就被上一张的状态覆盖掉。
      if (gen !== generation || current !== sid) return;

      switch (st.status) {
        case "pending":
          setStatus("等待扫码", "pending", true);
          break;
        case "scanned":
          setStatus("已扫码，请在手机上确认", "scanned", true);
          break;
        case "authorized":
        case "confirmed":
          stopTimers();
          setStatus("授权成功，正在入库…", "authorized", false);
          // 去抖：延迟执行 confirm，让并发 poll 回调有机会被 stopTimers 拦截
          settleTimer = setTimeout(async () => {
            settleTimer = null;
            await confirm();
          }, 300);
          break;
        case "expired":
        case "unknown":
          stopTimers();
          setStatus("二维码已失效，重新生成中…", "error", false);
          setTimeout(newQR, 800);
          break;
        case "cancelled":
          stopTimers();
          $("countdown").textContent = "已取消";
          setStatus("已取消，请重新生成", "error", false);
          break;
      }
    }

    async function confirm() {
      // 防重入：若已有 confirm 正在执行（可能来自重复的 poll 回调），直接静默丢弃
      if (confirming) return;
      confirming = true;
      $("refreshBtn").disabled = true;
      try {
        const acc = await api("POST", `/qr/${sid}/confirm`);
        showSuccess(acc);
      } catch (e) {
        const msg = e.message || "未知错误";
        if (e.status === 404 && msg.includes("not found")) {
          setStatus("会话已失效，请重新扫码", "error", false);
          $("countdown").textContent = "请点击「重新生成」";
        } else if (e.status === 409) {
          setStatus("入库失败：" + msg, "error", false);
          $("countdown").textContent = "请稍后重试或重新扫码";
        } else {
          setStatus("入库失败：" + msg, "error", false);
        }
      } finally {
        confirming = false;
        $("refreshBtn").disabled = false;
      }
    }

    $("refreshBtn").addEventListener("click", newQR);

    // ---- 代理面板事件 ----
    $("scanProxyMode").addEventListener("change", async () => {
      toggleProxyFields();
      if (currentProxyMode() === "profile") await loadProxyOptions();
    });
    $("proxyPanel").addEventListener("toggle", async () => {
      if ($("proxyPanel").open && currentProxyMode() === "profile") await loadProxyOptions();
    });
    $("scanProvince").addEventListener("change", async () => {
      await loadProxyCities();
      $("proxyCurrent").textContent = proxyLabel();
    });
    $("scanCity").addEventListener("change", () => { $("proxyCurrent").textContent = proxyLabel(); });
    $("scanProxyProfile").addEventListener("change", () => { $("proxyCurrent").textContent = proxyLabel(); });
    $("scanChannel").addEventListener("change", () => {
      if (confirming) return;
      // 渠道变了必须换一张二维码：同一张码对应的是旧渠道的 appid
      newQR();
    });
    $("applyProxyBtn").addEventListener("click", () => {
      if (confirming) return;
      $("proxyPanel").open = false;
      $("proxyCurrent").textContent = proxyLabel();
      // 重新生成二维码：代理在「建会话」阶段就绑定，改完必须换一张
      newQR();
    });

    newQR();
  </script>
  <script src="/static/js/platform.js?v=20261030-ui4"></script>
</body>
</html>
