<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>账号授权 · yybwechat</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/css/console.css?v=20261030-ui3">
  <link rel="stylesheet" href="/static/css/scan-channel.css?v=20261030-ui">
  <style>
    /* 一次性授权页是公开页面，不加载外壳脚本，主题在这里自己落定。
       键与外壳保持一致：面板里选过深色，这里就不会先闪一帧浅色。
       颜色 / 圆角 / 阴影一律走 console.css 的 token，不写死任何色值。 */
    .link-page { min-height: 100vh; display: grid; place-items: center; padding: 30px 18px 44px; }
    .link-card {
      width: min(440px, 100%); padding: 22px 24px 24px; text-align: center;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
      animation: cardIn 200ms ease-out;
    }
    .link-card .mark {
      display: grid; place-items: center;
      width: 38px; height: 38px; margin: 0 auto 12px;
      border-radius: 10px; background: var(--grad-brand); color: #fff;
      font-size: 14px; font-weight: 700;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.35), 0 2px 6px -1px oklch(0.45 0.16 275 / 0.45);
    }
    .link-card h1 { font-size: 17px; font-weight: 650; letter-spacing: -0.015em; }
    .link-card > p { margin-top: 5px; color: var(--faint); font-size: 12px; line-height: 1.6; }
    .link-card .notice { margin-top: 14px; text-align: left; }
    .link-card .notice strong { display: block; font-weight: 620; }

    .scan-channel { display: grid; gap: 6px; margin-top: 14px; text-align: left; }
    .scan-channel small { color: var(--faint); font-size: 11px; }

    .qr {
      width: min(260px, 100%); height: auto; aspect-ratio: 1;
      margin: 16px auto 14px; display: grid; place-items: center; overflow: hidden;
      border: 1px solid var(--line); border-radius: var(--radius-md);
      background: var(--surface-2); color: var(--faint); font-size: 12px;
    }
    .qr img { width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }

    .state { min-height: 22px; font-size: 12.5px; color: var(--muted); font-weight: 550; }
    .state.error { color: var(--danger); }
    .state.ok { color: var(--success); }
    .expiry { min-height: 18px; margin-top: 2px; font-size: 11.5px; color: var(--warning); font-variant-numeric: tabular-nums; }
    .expiry.ok { color: var(--success); }
    .link-card .btn { margin-top: 14px; }
    .link-card .hint { margin-top: 14px; }
  </style>
</head>
<body>
  <main class="link-page">
    <div class="link-card">
      <div class="mark" aria-hidden="true">YB</div>
      <h1>账号授权</h1>
      <p id="intro">这是一次性扫码授权链接，扫码账号不匹配时不会写入任何账号数据。</p>
      <div class="notice warn"><strong>仅限现场扫码</strong>请直接使用微信扫一扫完成授权，不要保存、转发或从相册识别二维码。刷新页面只会重新生成二维码，不会提前消耗授权链接。</div>
      <div class="scan-channel">
        <div class="field">
          <label for="scanProduct">扫码渠道</label>
          <select class="select" id="scanProduct"><option value="appstore">YYB</option><option value="pcmgr">PCMgr</option></select>
          <small id="channelHint">扫码成功后自动保存。</small>
        </div>
      </div>
      <div class="qr" id="qr">正在生成二维码…</div>
      <div class="state" id="state">链接校验中</div>
      <div class="expiry" id="expiry"></div>
      <button class="btn primary btn-block hidden" id="retry" type="button">重新生成二维码</button>
      <div class="notice hint">请确认微信中登录的是要授权的账号。链接只能成功使用一次，并会在有效期结束后自动失效。</div>
    </div>
  </main>
  <script>
    // 主题与外壳共用同一个 localStorage 键；公开页没有外壳脚本，这里补一次。
    (() => {
      const saved = localStorage.getItem("yybwechat-theme");
      const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      if (dark) document.documentElement.setAttribute("data-theme", "dark");
    })();
  </script>
  <script src="/static/js/scan-channel.js?v=20261030-ui"></script>
  <script>
    const token=location.pathname.split('/').filter(Boolean).pop();
    const $=id=>document.getElementById(id);let sid='',timer=null,expiryTimer=null,pollBusy=false,linkExpiresAt=0,saveAttempts=0;
	let generation=0,meta=null,selectedProduct='',confirmedProduct='',saving=false,completed=false;
    async function api(path,options={}){const response=await fetch(`/account-link/${encodeURIComponent(token)}${path}`,{cache:'no-store',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const text=await response.text();let data;try{data=text?JSON.parse(text):null}catch{const error=new Error(`服务返回异常（HTTP ${response.status}）`);error.status=response.status;throw error}if(!response.ok){const error=new Error(data?.msg||'链接已失效或授权失败');error.status=response.status;throw error}return data.data??data}
    function setState(text,kind=''){ $('state').textContent=text;$('state').className=`state ${kind}` }
    function stop(){if(timer){clearInterval(timer);timer=null}}
    function stopExpiry(){if(expiryTimer){clearInterval(expiryTimer);expiryTimer=null}}
    function renderExpiry(){if(!linkExpiresAt)return;const seconds=Math.max(0,linkExpiresAt-Math.floor(Date.now()/1000));if(seconds<=0){$('expiry').textContent='授权链接已过期';$('expiry').className='expiry state error';stop();if(expiryTimer){clearInterval(expiryTimer);expiryTimer=null}setState('授权链接已过期，请让发起方重新生成','error');$('retry').classList.add('hidden');return}const minutes=Math.floor(seconds/60),rest=seconds%60;$('expiry').textContent=`授权链接剩余 ${minutes}分${String(rest).padStart(2,'0')}秒`;}
    function startExpiry(expiresAt){if(expiresAt)linkExpiresAt=Number(expiresAt);stopExpiry();renderExpiry();expiryTimer=setInterval(renderExpiry,1000)}
    function renderChannelHint(){
      const switching=meta?.kind==='update'&&selectedProduct!==meta.source_product;
      $('channelHint').textContent=switching?'本次切换渠道，扫码成功后替换原 ID 授权。':'扫码成功后自动保存。';
      $('intro').textContent=meta?.kind==='update'
        ?`${switching?'切换':'更新'} ${meta.target||'账号 ID '+meta.account_id}，请使用原微信扫码。`
        :'可扫码添加新账号，授权成功后自动保存。';
    }
    async function create(){
      if(saving)return;
      const currentGeneration=++generation;stop();saveAttempts=0;
      const previous=sid;sid='';
      if(previous){try{await api(`/qr/${encodeURIComponent(previous)}/cancel`,{method:'POST',body:'{}'});}catch{}}
      if(currentGeneration!==generation)return;
      $('retry').classList.add('hidden');$('qr').textContent='正在生成二维码…';setState('请使用微信扫码');
      try{
        const data=await api('/qr',{method:'POST',body:JSON.stringify({product:selectedProduct,confirm_switch:confirmedProduct===selectedProduct})});
        if(currentGeneration!==generation){api(`/qr/${encodeURIComponent(data.session_id)}/cancel`,{method:'POST',body:'{}'}).catch(()=>{});return;}
        startExpiry(data.link_expires_at);sid=data.session_id;
        $('qr').innerHTML=`<img alt="仅限现场扫码，不要保存二维码" draggable="false" src="/account-link/${encodeURIComponent(token)}/qr/${encodeURIComponent(sid)}/image?t=${Date.now()}">`;
        timer=setInterval(poll,1500);await poll();
      }catch(error){
        if(currentGeneration!==generation)return;
        $('qr').textContent='二维码生成失败';setState(error.message,'error');
        if(error.status!==410)$('retry').classList.remove('hidden');
      }
    }
    async function poll(){
      const current=sid,currentGeneration=generation;
      if(!current||pollBusy===current||saving)return;
      pollBusy=current;
      try{
        const result=await api(`/qr/${encodeURIComponent(current)}/poll`);
        if(current!==sid||currentGeneration!==generation)return;
        if(result.status==='pending'){setState('等待扫码');}
        else if(result.status==='scanned'){setState('已扫码，请在手机上确认授权');}
        else if(result.status==='authorized'||result.status==='confirmed'){
          stop();
          if(saveAttempts>=12){setState('账号保存超时，请重新生成二维码','error');$('retry').classList.remove('hidden');return;}
          saveAttempts++;saving=true;$('scanProduct').disabled=true;$('retry').disabled=true;
          setState('授权成功，正在保存账号');
          const account=await api(`/qr/${encodeURIComponent(current)}/confirm`,{method:'POST',body:'{}'});
          if(current!==sid||currentGeneration!==generation)return;
          saveAttempts=0;sid='';completed=true;stopExpiry();$('expiry').textContent='授权链接已消费';$('expiry').className='expiry state ok';$('qr').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:44px;height:44px;color:var(--success)" aria-hidden="true"><path d="m4.5 12.5 5 5 10-10"/></svg>';
          setState(`授权完成：账号 ID ${account.id}，请关闭此标签页`,'ok');
          $('intro').textContent=account.warning||'本次授权已完成，链接已经失效。请直接关闭此标签页。';
          if(account.warning)$('intro').classList.add('state','error');
        }else if(['expired','cancelled','unknown'].includes(result.status)){
          stop();setState('二维码已过期，授权链接仍有效，可重新生成','error');$('retry').classList.remove('hidden');
        }
      }catch(error){
        if(current!==sid||currentGeneration!==generation)return;
        if(error.status===410){stop();stopExpiry();setState('授权链接已失效，请让发起方重新生成','error');$('retry').classList.add('hidden');}
        else if(error.status===404||error.status===409&&!error.message.startsWith('buffer not ready')){
          stop();setState(error.message,'error');$('retry').classList.remove('hidden');
        }else if((error.status===409||error.status===502)&&saveAttempts>0&&saveAttempts<12){
          setState('授权已确认，正在自动完成账号保存');setTimeout(()=>{if(current===sid&&currentGeneration===generation)poll();},1500);
        }else{setState(error.message||'网络暂时波动，正在自动重试','error');if(!timer)$('retry').classList.remove('hidden');}
      }finally{
        saving=false;$('scanProduct').disabled=completed;$('retry').disabled=false;
        if(pollBusy===current)pollBusy=false;
      }
    }
    $('retry').addEventListener('click',create);
    $('scanProduct').addEventListener('change',async()=>{
      const next=$('scanProduct').value;
      if(saving){$('scanProduct').value=selectedProduct;return;}
      stop();++generation;$('scanProduct').disabled=true;
      try{
        if(meta.kind==='update'&&!await confirmScanChannelSwitch({from:selectedProduct,to:next,account:`账号 ID ${meta.account_id}`})){
          $('scanProduct').value=selectedProduct;timer=setInterval(poll,1500);return;
        }
        selectedProduct=next;confirmedProduct=meta.kind==='update'?next:'';
        renderChannelHint();await create();
      }finally{$('scanProduct').disabled=completed;}
    });
    api('/meta').then(data=>{
      meta=data;selectedProduct=data.product;confirmedProduct=data.switch_confirmed?data.product:'';
      $('scanProduct').value=selectedProduct;startExpiry(data.expires_at);renderChannelHint();create();
    }).catch(error=>{$('qr').textContent='链接不可用';setState(error.message,'error');$('scanProduct').disabled=true;});
  </script>
</body>
</html>
